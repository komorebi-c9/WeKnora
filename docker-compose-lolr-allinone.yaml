# ============================================================================
# WeKnora 单镜像启动（frontend + app + docreader 三进程同容器）
#
# 与 docker-compose-lolr.yml 一致：运行时变量通过 `env_file: .env` 引入，
# 下面的 `environment` 只覆盖“容器内视角”必须改变的项：
#   1) DB_HOST / REDIS_ADDR 由 localhost 改为宿主机网关（Linux 由 extra_hosts 提供）
#   2) STORAGE_TYPE 由 .env 里的 minio 改为 local（本机没有 MinIO）
#   3) REDIS_DB 改为 5，避免与宿主机上的开发实例抢 asynq 队列
#   4) AUTO_MIGRATE 默认关闭，避免共用开发库时自动跑迁移
#
# 使用：
#   docker compose -f docker-compose-lolr-1.yaml up -d
#   http://<宿主机IP>:18080/lolr-kb/
#
# 常用覆盖：
#   ALLINONE_IMAGE=swr.cn-north-4.myhuaweicloud.com/xbh/orion/lolr-kb-allinone:1.0.0 \
#   ALLINONE_PORT=80 \
#   docker compose -f docker-compose-lolr-1.yaml up -d
# ============================================================================
# 独立 compose 项目名：避免与仓库里的 docker-compose-lolr.yml（weknora 项目）
# 的容器/网络混在一起，也避免 `docker compose down` 时误伤开发实例。
name: weknora-allinone

services:
  allinone:
    image: ${ALLINONE_IMAGE:-swr.cn-north-4.myhuaweicloud.com/xbh/orion/lolr-kb-allinone:1.0.0}
    container_name: WeKnora-allinone
    restart: unless-stopped
    # 三进程的优雅退出预算：nginx(20s) + app(90s) + docreader(60s)
    stop_grace_period: 180s

    ports:
      - "${ALLINONE_PORT:-18080}:80"

    # 容器内访问宿主机上的 Postgres / Redis / Ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # 上传原件与解析产物（对应 app 的 /data/files）
      - allinone-files:/data/files
      # 可选：用宿主机配置覆盖镜像内默认 config.yaml
      - ./config/config.yaml:/app/config/config.yaml:ro
    env_file:
      - .env
    environment:
      # ---------- 同容器进程间地址（固定回环） ----------
      APP_HOST: 127.0.0.1
      APP_PORT: "8080"
      APP_SCHEME: http
      DOCREADER_ADDR: 127.0.0.1:50051
      DOCREADER_IMAGE_OUTPUT_DIR: /tmp/docreader

      # ---------- 数据库（.env 里是 localhost，容器内必须换宿主网关） ----------
      DB_DRIVER: ${DB_DRIVER:-postgres}
      DB_HOST: ${ALLINONE_DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5434}
      DB_NAME: ${DB_NAME:-WeKnora}
      # DB_USER / DB_PASSWORD 走 env_file，不在这里重复

      # ---------- Redis（同样换宿主网关；DB 5 隔离队列） ----------
      REDIS_ADDR: ${ALLINONE_REDIS_ADDR:-host.docker.internal:6379}
      REDIS_DB: ${ALLINONE_REDIS_DB:-5}
      REDIS_PREFIX: ${ALLINONE_REDIS_PREFIX:-smoke:}
      STREAM_MANAGER_TYPE: ${STREAM_MANAGER_TYPE:-redis}
      # REDIS_PASSWORD 走 env_file

      # ---------- 文件存储（.env 当前是 minio，本机无 MinIO，覆盖为本地） ----------
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      LOCAL_STORAGE_BASE_DIR: ${LOCAL_STORAGE_BASE_DIR:-/data/files}

      # ---------- 迁移与检索 ----------
      # 共用宿主机开发库时默认 false；独立库部署可设 ALLINONE_AUTO_MIGRATE=true
      AUTO_MIGRATE: ${ALLINONE_AUTO_MIGRATE:-false}
      RETRIEVE_DRIVER: ${RETRIEVE_DRIVER:-postgres}
      AUTO_RECOVER_DIRTY: ${AUTO_RECOVER_DIRTY:-true}

      # ---------- 前端运行时 ----------
      # 必须与镜像构建时的 VITE_BASE_PATH 一致（Orion 网关路由 /lolr-kb）
      WEKNORA_BASE_PATH: ${WEKNORA_BASE_PATH:-/lolr-kb}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-100}
      MAX_SKILL_BUNDLE_SIZE_MB: ${MAX_SKILL_BUNDLE_SIZE_MB:-256}

      # ---------- 知识与图谱（.env 里 NEO4J_URI 也是 localhost） ----------
      # NEO4J_ENABLE / NEO4J_USERNAME / NEO4J_PASSWORD 沿用 .env；
      # 仅把地址换到宿主机网关（宿主机已有 Neo4j: 0.0.0.0:7687）。
      NEO4J_URI: ${ALLINONE_NEO4J_URI:-bolt://host.docker.internal:7687}

      # ---------- ODL ----------
      # .env 里是 hybrid=docling-fast + http://odl-hybrid:5002，但单镜像内没有 odl-hybrid。
      # 默认关闭 hybrid，走镜像内的本地 JVM 模式；若确实起了 sidecar，把 URL 指到
      # host.docker.internal:5002 并把 ALLINONE_ODL_HYBRID 设为 docling-fast。
      DOCREADER_ODL_HYBRID: ${ALLINONE_ODL_HYBRID:-off}
      DOCREADER_ODL_HYBRID_URL: ${ALLINONE_ODL_HYBRID_URL:-}

      # 若使用宿主机上的 Ollama，把 .env 里的 localhost 换到宿主网关
      OLLAMA_BASE_URL: ${ALLINONE_OLLAMA_BASE_URL:-http://host.docker.internal:11435/v1}
      # 允许容器访问宿主网关上的服务（SSRF 白名单）
      SSRF_WHITELIST: ${SSRF_WHITELIST:-},host.docker.internal

      # ---------- 运行形态 ----------
      TZ: ${TZ:-Asia/Shanghai}
      GIN_MODE: ${GIN_MODE:-release}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WEKNORA_SANDBOX_DOCKER_ENABLED: "false"

    healthcheck:
      test: ["CMD", "/usr/local/bin/allinone-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

    networks:
      - lolr-kb-net

networks:
  lolr-kb-net:
    driver: bridge

volumes:
  allinone-files:
