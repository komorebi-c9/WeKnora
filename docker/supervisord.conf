; WeKnora 单镜像进程管理
;
; 进程拓扑：docreader(50051) -> app(8080) -> nginx(15173，NGINX_LISTEN_PORT 可覆盖)
; 启动顺序按 priority 升序；停止顺序为其反向（nginx -> app -> docreader）。
; app 的 docker-entrypoint.sh 会 chown /data/files 并 gosu 降权到 appuser；
; docreader 以 root 运行（Playwright 浏览器与 LibreOffice 的默认 HOME 行为）。
;
; 注意：不要在这里加 "[include]"；本文件由 -c 显式指定（allinone-entrypoint.sh）。

[supervisord]
nodaemon=true
pidfile=/run/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0
loglevel=info
user=root

; 便于运维/排障：docker exec ... supervisorctl -c /etc/supervisor/supervisord.conf status
[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:docreader]
command=/app/.venv/bin/python -m docreader.container_entrypoint /app/.venv/bin/python -m docreader.main
directory=/app
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
environment=PYTHONUNBUFFERED="1",HOME="/root"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:app]
command=/app/scripts/docker-entrypoint.sh /app/WeKnora
directory=/app
priority=20
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=90
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=30
autostart=true
autorestart=true
startsecs=3
startretries=10
stopsignal=QUIT
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
